  # ---------------------------------------------------------------------------
  # Post-Apply Shell Callback Commands (Run after Apply / Roll-back completes)
  # [EDITABLE: YES] [EXTENSIBLE: YES -> Add cmd0, cmd1, cmd2 ... up to cmd31]
  #
  # HOW IT WORKS:
  #   - Executed sequentially via '/bin/sh -c' right after xrandr applies the
  #     new monitor layout (useful for reloading wallpaper, polybar, bspwm,
  #     dunst, picom, or sending desktop notifications).
  #   - Empty strings ("" or '') are safely skipped.
  #   - You can increase CmdNum or simply append cmd2, cmd3, cmd4... (up to 32
  #     commands total; CmdNum automatically expands to the highest cmd<N>).
  #
  # Examples (uncomment or copy into cmd0, cmd1, cmd2...):
  #   - cmd0: "/home/fus/.config/bspwm/scripts/background.sh"
  #   - cmd1: "polybar-msg cmd restart || ~/.config/polybar/launch.sh &"
  #   - cmd2: "bspc wm -r"
  #   - cmd3: "feh --bg-fill ~/Pictures/wallpaper.jpg"
  #   - cmd4: "notify-send 'MonitorSelection' 'Display layout applied!'"
  # ---------------------------------------------------------------------------
  - ApplyCallBack:  # Run after the Apply button action done
        - CmdNum:  2
        - cmd0: "/home/fus/.config/bspwm/scripts/background.sh &"
        - cmd1: "sleep 1"
        - cmd2: "/home/fus/.config/bspwm/polybar/polybar-ob &"
        - cmd3: "notify-send 'Monitor Selection' 'Display layout applied!'"