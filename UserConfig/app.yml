# =============================================================================
# MonitorSelection - Application Configuration File (app.yml)
# =============================================================================
# HOW TO USE THIS FILE (RC / .zshrc Style Guide):
#
# 1. CAN I EDIT VALUES? (Duoc sua khong?)
#    - [EDITABLE: YES] -> PreferDispPath, SnapThresholdPx, MainWindow (Title,
#                         W, H, IsVisible, Mode), Layer0 & Layer2 component
#                         positions (OffsetX, OffsetY, Color, FontSize,
#                         IsVisible - e.g. Comp3 HeaderText status bar!), and
#                         ApplyCallBack (CmdNum, cmd0..cmd31) are loaded
#                         dynamically at startup!
#    - [NOTE]          -> Layer1 monitor card positions are loaded from disp.yml.
#
# 2. CAN I ADD NEW ITEMS? (Duoc them khong?)
#    - [EXTENSIBLE: YES] -> Under 'ApplyCallBack:', you can freely add more
#                           commands: cmd0, cmd1, cmd2, cmd3 ... up to cmd31
#                           (max 32 commands, SYSCALL_MAX_APPLY_CMDS = 32).
#    - [EXTENSIBLE: NO]  -> Do not add arbitrary top-level keys or extra UI
#                           layers here without registering them in main.c.
# =============================================================================

App:
  # ---------------------------------------------------------------------------
  # Path to the user display preference file (disp.yml)
  # [EDITABLE: YES] [EXTENSIBLE: NO]
  # Example:
  #   - PreferDispPath: "UserConfig/disp.yml"
  #   - PreferDispPath: "/home/fus/Documents/MonitorSelection/UserConfig/disp.yml"
  # ---------------------------------------------------------------------------
  - PreferDispPath: "/home/fus/Documents/MonitorSelection/UserConfig/disp.yml"

  # ---------------------------------------------------------------------------
  # Magnetic edge & corner snapping distance threshold (in pixels) on Canvas
  # [EDITABLE: YES] [EXTENSIBLE: NO]
  # Example:
  #   - SnapThresholdPx: 15    # Tighter magnetic snap
  #   - SnapThresholdPx: 25    # Default magnetic snap (recommended)
  #   - SnapThresholdPx: 40    # Stronger magnetic pull
  # ---------------------------------------------------------------------------
  - SnapThresholdPx: 25

  # ---------------------------------------------------------------------------
  # Top-level SDL2 Main Window geometry, default Font & startup state
  # [EDITABLE: YES] [EXTENSIBLE: NO]
  # Example:
  #   - Title: "My Custom Monitor Manager"
  #   - W: 800
  #   - H: 540
  #   - IsVisible: 1                        # 1 = Show window on start, 0 = Start hidden
  #   - Mode: "FLOATING"                    # "FLOATING" | "MAXIMIZED"
  #   - Font: "CodeNewRoman Nerd Font"      # Global default font family (via fc-match) or .ttf/.otf path
  # ---------------------------------------------------------------------------
  - MainWindow:
      - Title: "Monitor Selection"
          - Format:
            - Bold: 1               # 0 | 1
            - Italic: 1             # 0 | 1
            - Algin:
                - Vertical: "Center" # Left | Right
                - Horizona: "Center" # Left | Right
      - W: 800
      - H: 540
      - IsVisible: 1
      - Mode: "FLOATING"               # FLOATING | MAXIMIZED
      - Font: "CodeNewRoman Nerd Font" # Global default font (any component can override with its own - Font:)
      # -----------------------------------------------------------------------
      # UI Layer & Component Hierarchy
      # [EDITABLE: YES for OffsetX, OffsetY, Color, Font, FontSize, IsVisible]
      # [EXTENSIBLE: NO]
      # Layer0 = Header & Status Bar (Comp2=StatusCircle, Comp3=HeaderText)
      # Layer1 = Monitor Canvas | Layer2 = Right Property Panel (PROP)
      # -----------------------------------------------------------------------
