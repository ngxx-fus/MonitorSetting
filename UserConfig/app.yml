# =============================================================================
# MonitorSelection - Application Configuration File (app.yml)
# =============================================================================
# HOW TO USE THIS FILE (RC / .zshrc Style Guide):
#
# 1. CAN I EDIT VALUES?
#    - [EDITABLE: YES] -> PreferDispPath, SnapThresholdPx, MainWindow (Title,
#                         Color, W, H, IsVisible, Mode, Font, Format), Layer0,
#                         Layer1 & Layer2 component properties (OffsetX,
#                         OffsetY, W, H, Color, Font, FontSize, Format,
#                         TextStr, TextStrFmt, IsVisible), and ApplyCallBack
#                         (CmdNum, cmd0..cmd31) are loaded dynamically at
#                         startup!
#    - [NOTE]          -> Layer1 monitor card positions are loaded from disp.yml.
#
# 2. CAN I ADD NEW ITEMS?
#    - [EXTENSIBLE: YES] -> Under 'ApplyCallBack:', you can freely add more
#                           commands: cmd0, cmd1, cmd2, cmd3 ... up to cmd31
#                           (max 32 commands, SYSCALL_MAX_APPLY_CMDS = 32).
#    - [EXTENSIBLE: NO]  -> Do not add arbitrary top-level keys or extra UI
#                           layers here without registering them in main.c.
# =============================================================================

App:
  # ---------------------------------------------------------------------------
  # Path to the user display preference file (disp.yml)
  # [EDITABLE: YES] [EXTENSIBLE: NO]
  # Example:
  #   - PreferDispPath: "UserConfig/disp.yml"
  #   - PreferDispPath: "/home/fus/Documents/MonitorSelection/UserConfig/disp.yml"
  # ---------------------------------------------------------------------------
  - PreferDispPath: "/home/fus/Documents/MonitorSelection/UserConfig/disp.yml"

  # ---------------------------------------------------------------------------
  # Magnetic edge & corner snapping distance threshold (in pixels) on Canvas
  # [EDITABLE: YES] [EXTENSIBLE: NO]
  # Example:
  #   - SnapThresholdPx: 15    # Tighter magnetic snap
  #   - SnapThresholdPx: 25    # Default magnetic snap (recommended)
  #   - SnapThresholdPx: 40    # Stronger magnetic pull
  # ---------------------------------------------------------------------------
  - SnapThresholdPx: 25

  # ---------------------------------------------------------------------------
  # Top-level SDL2 Main Window geometry, background Color, default Font & state
  # [EDITABLE: YES] [EXTENSIBLE: NO]
  #
  # VISUAL LAYOUT MAP (800x540 Window Layout):
  # +-------------------------------------------------------------------------+ (0,0) -> (800,540)
  # | MainWindow Background (MainWindow -> Color: 0xFF12161F)                 | <- Outer margin & bottom bar!
  # |   +-----------------------------------------------------------------+   | (OffsetX:30, OffsetY:30, W:740, H:460)
  # |   | Layer0 -> Comp0: "MainPanel" (Color: 0xFF232936, Radius: 10)    |   | <- Inner rounded container panel!
  # |   |   [Comp2:Circle] [Comp3:HeaderText "Ready | ..."]               |   |
  # |   |   -----------------------------------------------------------   |   | <- Comp1: "HeaderLine" (Y=82)
  # |   |   +-----------------------------------+ +-------------------+   |   |
  # |   |   | Layer0 -> Comp6: "CanvasPanelBg"  | | Layer2 (X:550,Y:95|   |   |
  # |   |   | + Layer1 (X:40, Y:95, W:500,H:380)| |  W:210, H:380)    |   |   |
  # |   |   |   [Layer1->Comp0: Card "HDMI-1"]  | |  Comp0:PropPanelBg|   |   |
  # |   |   |   [Layer1->Comp1: Card "DP-2"]    | |  Comp1:PropTitle  |   |   |
  # |   |   |   [Layer1->Comp2: Card "eDP-1"]   | |  Comp2..Comp11    |   |   |
  # |   |   +-----------------------------------+ +-------------------+   |   |
  # |   +-----------------------------------------------------------------+   | (MainPanel bottom = 30 + 460 = 490)
  # |                                      [Comp4:Roll-back] [Comp5:Apply]    | <- Placed at Y=500 (in MainWindow bottom bar)
  # +-------------------------------------------------------------------------+
  #
  # IMPORTANT BACKGROUND COLOR NOTES (0xAARRGGBB: AA = Alpha opacity, RRGGBB = RGB hex):
  #   1. MainWindow -> Color (e.g. 0xFF12161F):
  #      - Fills the ENTIRE 800x540 window (including the 30px outer perimeter
  #        and the Y=490..540 bottom strip containing the Roll-back & Apply buttons).
  #      - For an opaque dark outer background: set 0xFF12161F (Alpha = FF = opaque).
  #      - For a transparent outer background: set 0x0012161F (Alpha = 00 = transparent).
  #   2. Layer0 -> Comp0 ("MainPanel") -> Color (e.g. 0xFF232936):
  #      - Fills the inner rounded container panel (OffsetX:30, OffsetY:30, W:740, H:460).
  #      - If Roll-back & Apply are placed at OffsetY: 500 and you want MainPanel
  #        to enclose both buttons inside its rounded border, increase Comp0 H from 460 to 502!
  #      - For a fully see-through window, set Alpha to 00 on BOTH MainWindow -> Color
  #        (0x0012161F) AND Layer0 -> Comp0 -> Color (0x00232936).
  # ---------------------------------------------------------------------------
  - MainWindow:
      - Title: "Monitor Selection"
      - Color: 0xFF12161F              # Full 800x540 window background color (0xFF12161F = opaque dark, 0x0012161F = transparent)
      - Format:
          - Bold: 1                    # Global default Bold (0 = Regular, 1 = Bold)
          - Italic: 0                  # Global default Italic (0 = Normal, 1 = Italic)
          - Algin:
              - Vertical: "Center"     # "Top" | "Center" | "Bottom"
              - Horizona: "Center"     # "Left" | "Center" | "Right"
      - W: 800                         # Full window width in pixels
      - H: 540                         # Full window height in pixels
      - IsVisible: 1                   # 1 = Show window on startup, 0 = Start hidden
      - Mode: "FLOATING"               # "FLOATING" | "MAXIMIZED"
      - Font: "CodeNewRoman Nerd Font" # Global default font family (any Comp below can override with its own - Font:)
      # -----------------------------------------------------------------------
      # UI Layer & Component Hierarchy
      # [EDITABLE: YES for OffsetX, OffsetY, W, H, Color, Font, FontSize, Format, TextStr, TextStrFmt, IsVisible]
      # [EXTENSIBLE: NO]
      # -----------------------------------------------------------------------
      - Layers:
          # ===================================================================
          # LAYER 0: Main Container Panel, Header Status Bar, Roll-back/Apply Buttons, and Canvas Background
          # All (OffsetX, OffsetY) coordinates in Layer0 are relative to MainWindow top-left (0, 0).
          # ===================================================================
          - Layer0:
              - LayerId: 0
              - IsVisible: 1
              - IsScrollable: 0
              - RectClip:
                  - W: 0
                  - H: 0
                  - OffsetX: 0
                  - OffsetY: 0
                  - Rotation: 0
              - Comps:
                  # -----------------------------------------------------------
                  # Layer0 -> Comp0: Inner Rounded Container Panel ("MainPanel")
                  # - Default geometry: OffsetX:30, OffsetY:30, W:740 (to X=770), H:460 (to Y=490).
                  # - Tip: To enclose the Roll-back/Apply buttons (at Y=500) inside this panel,
                  #   change H: 460 -> H: 502 (or set W:800, H:540, OffsetX:0, OffsetY:0 to fill the window).
                  # -----------------------------------------------------------
                  - Comp0:
                      - Class: "CONTAINER"
                      - Label: "MainPanel"
                      - CastType: "RECT"
                      - IsDraggable: 0
                      - IsVisible: 1
                      - Type:
                          - Color: 0xFF232936          # MainPanel background color (0xAARRGGBB)
                          - Radius: 10                 # Corner radius in pixels (0 = sharp corners)
                          - IsFilled: 1                # 1 = Filled rectangle, 0 = Outline only
                          - Dim:
                              - W: 740                 # MainPanel width in pixels
                              - H: 460                 # MainPanel height in pixels (set to 502 to enclose buttons at Y=500)
                              - OffsetX: 30            # Left margin from window edge (px)
                              - OffsetY: 30            # Top margin from window edge (px)
                              - Rotation: 0
                          - Border:
                              - Size: 1                # Border thickness in pixels (0 = no border)
                              - Color: 0xFF4A5568      # MainPanel border color
                  # -----------------------------------------------------------
                  # Layer0 -> Comp1: Horizontal Header Separator Line ("HeaderLine")
                  # - Drawn from (OffsetX, OffsetY) = (40, 82) to (EndX, EndY) = (760, 82)
                  # -----------------------------------------------------------
                  - Comp1:
                      - Class: "CUSTOM"
                      - Label: "HeaderLine"
                      - CastType: "LINE"
                      - IsDraggable: 0
                      - IsVisible: 1
                      - Type:
                          - Color: 0xFF00B4D8          # Cyan separator line color
                          - Thickness: 2               # Line thickness in pixels
                          - EndX: 760                  # Line end X coordinate
                          - EndY: 82                   # Line end Y coordinate
                          - Dim:
                              - W: 720
                              - H: 0
                              - OffsetX: 40            # Line start X coordinate
                              - OffsetY: 82            # Line start Y coordinate
                              - Rotation: 0
                  # -----------------------------------------------------------
                  # Layer0 -> Comp2: Pulsing Status Indicator Circle ("StatusCircle")
                  # - Alternates green/cyan in the top-left header bar via MiscBackgroundThread
                  # -----------------------------------------------------------
                  - Comp2:
                      - Class: "CUSTOM"
                      - Label: "StatusCircle"
                      - CastType: "CIRCLE"
                      - IsDraggable: 0
                      - IsVisible: 1
                      - Type:
                          - Color: 0xFF00E676          # Initial circle fill color
                          - Radius: 10                 # Circle radius in pixels
                          - IsFilled: 1
                          - Dim:
                              - W: 24
                              - H: 24
                              - OffsetX: 50            # Circle bounding-box X position
                              - OffsetY: 48            # Circle bounding-box Y position
                              - Rotation: 0
                          - Border:
                              - Size: 1
                              - Color: 0xFFE2E8F0
                  # -----------------------------------------------------------
                  # Layer0 -> Comp3: Header Status Bar Text ("HeaderText")
                  # - Displays live status messages ("Ready | ...", "Applied...", etc.)
                  # -----------------------------------------------------------
                  - Comp3:
                      - Class: "LABEL"
                      - Label: "HeaderText"
                      - CastType: "TEXT"
                      - IsDraggable: 0
                      - IsVisible: 1
                      - Type:
                          - Color: 0xFFE2E8F0          # Status bar text color
                          - TextStr: "Ready | Click or drag a monitor card to edit properties"
                          - Font: "CodeNewRoman Nerd Font"
                          - FontSize: 13
                          - Format:
                              - Bold: 1
                              - Italic: 0
                              - Algin:
                                  - Vertical: "Center"     # "Top" | "Center" | "Bottom"
                                  - Horizona: "Left"       # "Left" | "Center" | "Right"
                          - IsWrap: 0
                          - Dim:
                              - W: 668                 # Text alignment box width
                              - H: 20                  # Text alignment box height
                              - OffsetX: 82            # X position (to the right of StatusCircle)
                              - OffsetY: 50            # Y position on Header bar
                              - Rotation: 0
                  # -----------------------------------------------------------
                  # Layer0 -> Comp4: "Roll-back" Button (Restore previous display snapshot)
                  # - Type -> Dim controls the button rectangle position and size.
                  # - ExtComps -> ExtComp0 controls the "Roll-back" label inside the button.
                  # -----------------------------------------------------------
                  - Comp4:
                      - Class: "BUTTON"
                      - Label: "Roll-back"
                      - CastType: "RECT"
                      - IsDraggable: 0
                      - IsVisible: 1
                      - Type:
                          - Color: 0xFF4A5568          # Roll-back button background color
                          - Radius: 6
                          - IsFilled: 1
                          - Dim:
                              - W: 115
                              - H: 28
                              - OffsetX: 525           # Roll-back button X position
                              - OffsetY: 500           # Roll-back button Y position (46 = Header bar, 500 = Bottom bar)
                              - Rotation: 0
                          - Border:
                              - Size: 1
                              - Color: 0xFFFFFFFF
                      - Listeners:
                          - Event0:
                              - Type: "EVENT_TYPE_MOUSE_DOWN"
                              - CallBack: "OnBtnRollbackClick"
                      - ExtComps:
                          - Count: 1
                          - ExtComp0:
                              - CastType: "TEXT"
                              - Color: 0xFFFFFFFF      # Roll-back button text color
                              - TextStr: "Roll-back"
                              - Font: "CodeNewRoman Nerd Font"
                              - FontSize: 13
                              - Format:
                                  - Bold: 1
                                  - Italic: 0
                                  - Algin:
                                      - Vertical: "Center"
                                      - Horizona: "Center"
                              - IsWrap: 0
                              - Dim:
                                  - W: 115
                                  - H: 28
                                  - OffsetX: 525
                                  - OffsetY: 500
                                  - Rotation: 0
                  # -----------------------------------------------------------
                  # Layer0 -> Comp5: "Apply" Button (Apply xrandr config & save disp.yml)
                  # -----------------------------------------------------------
                  - Comp5:
                      - Class: "BUTTON"
                      - Label: "Apply"
                      - CastType: "RECT"
                      - IsDraggable: 0
                      - IsVisible: 1
                      - Type:
                          - Color: 0xFF2B6CB0          # Apply button background color (blue)
                          - Radius: 6
                          - IsFilled: 1
                          - Dim:
                              - W: 115
                              - H: 28
                              - OffsetX: 650           # Apply button X position
                              - OffsetY: 500           # Apply button Y position (46 = Header bar, 500 = Bottom bar)
                              - Rotation: 0
                          - Border:
                              - Size: 1
                              - Color: 0xFFFFFFFF
                      - Listeners:
                          - Event0:
                              - Type: "EVENT_TYPE_MOUSE_DOWN"
                              - CallBack: "OnBtnApplyClick"
                      - ExtComps:
                          - Count: 1
                          - ExtComp0:
                              - CastType: "TEXT"
                              - Color: 0xFFFFFFFF      # Apply button text color
                              - TextStr: "Apply"
                              - Font: "CodeNewRoman Nerd Font"
                              - FontSize: 13
                              - Format:
                                  - Bold: 1
                                  - Italic: 0
                                  - Algin:
                                      - Vertical: "Center"
                                      - Horizona: "Center"
                              - IsWrap: 0
                              - Dim:
                                  - W: 115
                                  - H: 28
                                  - OffsetX: 650
                                  - OffsetY: 500
                                  - Rotation: 0
                  # -----------------------------------------------------------
                  # Layer0 -> Comp6: Left Monitor Canvas Background Frame ("CanvasPanelBg")
                  # - Located at (OffsetX:40, OffsetY:95, W:500, H:380), serving as the
                  #   visual backdrop for Layer1 (the 3 draggable monitor cards).
                  # -----------------------------------------------------------
                  - Comp6:
                      - Class: "CONTAINER"
                      - Label: "CanvasPanelBg"
                      - CastType: "RECT"
                      - IsDraggable: 0
                      - IsVisible: 1
                      - Type:
                          - Color: 0xFF1A202C          # Left Canvas background color
                          - Radius: 8
                          - IsFilled: 1
                          - Dim:
                              - W: 500
                              - H: 380
                              - OffsetX: 40
                              - OffsetY: 95
                              - Rotation: 0
                          - Border:
                              - Size: 1
                              - Color: 0xFF00B4D8      # Cyan border around the Canvas frame

          # ===================================================================
          # LAYER 1: Draggable Monitor Layout Canvas (Comp0, Comp1, Comp2)
          # - RectClip (OffsetX:40, OffsetY:95, W:500, H:380) bounds the drag area
          #   to match CanvasPanelBg (Layer0 -> Comp6).
          # - Initial card positions are computed from disp.yml; each Comp is matched
          #   to a physical monitor by its Label ("HDMI-1", "DP-2", "eDP-1") so you
          #   can customize Radius, Font, FontSize, Format (Bold/Italic/Algin), and
          #   TextStrFmt per monitor!
          # ===================================================================
          - Layer1:
              - LayerId: 1
              - IsVisible: 1
              - IsScrollable: 0
              - RectClip:
                  - W: 500
                  - H: 380
                  - OffsetX: 40
                  - OffsetY: 95
                  - Rotation: 0
              - Comps:
                  # -----------------------------------------------------------
                  # Layer1 -> Comp0: Monitor Card "HDMI-1" (auto-matched by Label!)
                  # - Supports TextStrFmt placeholders:
                  #   <Label>, <Primary>, <Res>, <W>, <H>, <Freq>, <PosX>, <PosY>, <State>
                  # - Set Format -> Bold: 1 (bold) or Bold: 0 (regular)
                  # -----------------------------------------------------------
                  - Comp0:
                      - Class: "BUTTON"
                      - Label: "HDMI-1"
                      - CastType: "RECT"
                      - IsDraggable: 1
                      - IsVisible: 1
                      - Type:
                          - Color: 0xDD1E4E8C
                          - Radius: 8
                          - IsFilled: 1
                          - Dim:
                              - W: 155
                              - H: 95
                              - OffsetX: 10
                              - OffsetY: 25
                              - Rotation: 0
                          - Border:
                              - Size: 2
                              - Color: 0xFF00E5FF
                      - Listeners:
                          - Event0:
                              - Type: "EVENT_TYPE_MOUSE_DOWN"
                              - CallBack: "OnCardSelectClick"
                          - Event1:
                              - Type: "EVENT_TYPE_DRAG_START"
                              - CallBack: "OnCardDragStart"
                          - Event2:
                              - Type: "EVENT_TYPE_DROP"
                              - CallBack: "OnCardDrop"
                          - Event3:
                              - Type: "EVENT_TYPE_MONITOR"
                              - CallBack: "OnMonitorEvent"
                          - Event4:
                              - Type: "EVENT_TYPE_USER_SIGNAL"
                              - CallBack: "OnUserSignalEvent"
                      - ExtComps:
                          - Count: 1
                          - ExtComp0:
                              - CastType: "TEXT"
                              - Color: 0xFFFFFFFF
                              # TextStrFmt placeholders: <Label>, <Primary>, <Res>, <W>, <H>, <Freq>, <PosX>, <PosY>, <State>
                              - TextStrFmt: "<Label>\n<Res>@<Freq>\nPOS(<PosX>, <PosY>)"
                              - Font: "CodeNewRoman Nerd Font"
                              - FontSize: 12
                              - Format:
                                  - Bold: 1
                                  - Italic: 0
                                  - Algin:
                                      - Vertical: "Center"
                                      - Horizona: "Center"
                              - IsWrap: 1
                              - Dim:
                                  - W: 155
                                  - H: 95
                                  - OffsetX: 10
                                  - OffsetY: 25
                                  - Rotation: 0
                  # -----------------------------------------------------------
                  # Layer1 -> Comp1: Monitor Card "DP-2" (auto-matched by Label!)
                  # -----------------------------------------------------------
                  - Comp1:
                      - Class: "BUTTON"
                      - Label: "DP-2"
                      - CastType: "RECT"
                      - IsDraggable: 1
                      - IsVisible: 1
                      - Type:
                          - Color: 0xDD2B6CB0
                          - Radius: 8
                          - IsFilled: 1
                          - Dim:
                              - W: 155
                              - H: 95
                              - OffsetX: 175
                              - OffsetY: 25
                              - Rotation: 0
                          - Border:
                              - Size: 1
                              - Color: 0xFFFFFFFF
                      - Listeners:
                          - Event0:
                              - Type: "EVENT_TYPE_MOUSE_DOWN"
                              - CallBack: "OnCardSelectClick"
                          - Event1:
                              - Type: "EVENT_TYPE_DRAG_START"
                              - CallBack: "OnCardDragStart"
                          - Event2:
                              - Type: "EVENT_TYPE_DROP"
                              - CallBack: "OnCardDrop"
                      - ExtComps:
                          - Count: 1
                          - ExtComp0:
                              - CastType: "TEXT"
                              - Color: 0xFFFFFFFF
                              - TextStrFmt: "<Label>\n<Res>@<Freq>\nPOS(<PosX>, <PosY>)"
                              - Font: "CodeNewRoman Nerd Font"
                              - FontSize: 12
                              - Format:
                                  - Bold: 0
                                  - Italic: 0
                                  - Algin:
                                      - Vertical: "Center"
                                      - Horizona: "Center"
                              - IsWrap: 1
                              - Dim:
                                  - W: 155
                                  - H: 95
                                  - OffsetX: 175
                                  - OffsetY: 25
                                  - Rotation: 0
                  # -----------------------------------------------------------
                  # Layer1 -> Comp2: Monitor Card "eDP-1" (auto-matched by Label!)
                  # -----------------------------------------------------------
                  - Comp2:
                      - Class: "BUTTON"
                      - Label: "eDP-1"
                      - CastType: "RECT"
                      - IsDraggable: 1
                      - IsVisible: 1
                      - Type:
                          - Color: 0xDD2C7A7B
                          - Radius: 8
                          - IsFilled: 1
                          - Dim:
                              - W: 155
                              - H: 95
                              - OffsetX: 10
                              - OffsetY: 130
                              - Rotation: 0
                          - Border:
                              - Size: 1
                              - Color: 0xFFFFFFFF
                      - Listeners:
                          - Event0:
                              - Type: "EVENT_TYPE_MOUSE_DOWN"
                              - CallBack: "OnCardSelectClick"
                          - Event1:
                              - Type: "EVENT_TYPE_DRAG_START"
                              - CallBack: "OnCardDragStart"
                          - Event2:
                              - Type: "EVENT_TYPE_DROP"
                              - CallBack: "OnCardDrop"
                      - ExtComps:
                          - Count: 1
                          - ExtComp0:
                              - CastType: "TEXT"
                              - Color: 0xFFFFFFFF
                              - TextStrFmt: "<Label>\n<Res>@<Freq>\nPOS(<PosX>, <PosY>)"
                              - Font: "CodeNewRoman Nerd Font"
                              - FontSize: 12
                              - Format:
                                  - Bold: 0
                                  - Italic: 0
                                  - Algin:
                                      - Vertical: "Center"
                                      - Horizona: "Center"
                              - IsWrap: 1
                              - Dim:
                                  - W: 155
                                  - H: 95
                                  - OffsetX: 10
                                  - OffsetY: 130
                                  - Rotation: 0

          # ===================================================================
          # LAYER 2: Right-Side Vertical Property Panel ("PROP" Panel)
          # - RectClip (OffsetX:550, OffsetY:95, W:210, H:380) positions the PROP
          #   panel to the right of the monitor Canvas.
          # - IMPORTANT: All (OffsetX, OffsetY) coordinates of Comp0..Comp11 inside
          #   Layer2 are LOCAL coordinates relative to Layer2's top-left origin (550, 95)!
          #   (e.g. OffsetX: 0, OffsetY: 0 in Layer2 corresponds to (550, 95) on the window).
          # ===================================================================
          - Layer2:
              - LayerId: 2
              - IsVisible: 1
              - IsScrollable: 0
              - RectClip:
                  - W: 210
                  - H: 380
                  - OffsetX: 550
                  - OffsetY: 95
                  - Rotation: 0
              - Comps:
                  # -----------------------------------------------------------
                  # Layer2 -> Comp0: Property Panel Rounded Background ("PropPanelBg")
                  # - OffsetX:0, OffsetY:0, W:210, H:380 (fills Layer2 clip region)
                  # -----------------------------------------------------------
                  - Comp0:
                      - Class: "CONTAINER"
                      - Label: "PropPanelBg"
                      - CastType: "RECT"
                      - IsDraggable: 0
                      - IsVisible: 1
                      - Type:
                          - Color: 0xFF1A202C          # Right PROP panel background color
                          - Radius: 8
                          - IsFilled: 1
                          - Dim:
                              - W: 210
                              - H: 380
                              - OffsetX: 0
                              - OffsetY: 0
                              - Rotation: 0
                          - Border:
                              - Size: 1
                              - Color: 0xFF00B4D8      # Cyan border around the PROP panel
                  # -----------------------------------------------------------
                  # Layer2 -> Comp1: Property Panel Header Title ("PropTitle", e.g. "PROP: eDP-1")
                  # - Supports optional TextStrFmt (e.g. "PROP: <Label> <Primary>")
                  # -----------------------------------------------------------
                  - Comp1:
                      - Class: "LABEL"
                      - Label: "PropTitle"
                      - CastType: "TEXT"
                      - IsDraggable: 0
                      - IsVisible: 1
                      - Type:
                          - Color: 0xFF00E5FF
                          - TextStr: "PROP: HDMI-1 [ORIGIN]"
                          - Font: "CodeNewRoman Nerd Font"
                          - FontSize: 14
                          - Format:
                              - Bold: 1
                              - Italic: 0
                              - Algin:
                                  - Vertical: "Center"
                                  - Horizona: "Left"
                          - IsWrap: 0
                          - Dim:
                              - W: 186
                              - H: 20
                              - OffsetX: 12
                              - OffsetY: 12
                              - Rotation: 0
                  # -----------------------------------------------------------
                  # Layer2 -> Comp2: Horizontal Separator Line under PROP Title ("PropSepLine")
                  # -----------------------------------------------------------
                  - Comp2:
                      - Class: "CUSTOM"
                      - Label: "PropSepLine"
                      - CastType: "LINE"
                      - IsDraggable: 0
                      - IsVisible: 1
                      - Type:
                          - Color: 0xFF4A5568
                          - Thickness: 1
                          - EndX: 200
                          - EndY: 38
                          - Dim:
                              - W: 190
                              - H: 0
                              - OffsetX: 10
                              - OffsetY: 38
                              - Rotation: 0
                  # -----------------------------------------------------------
                  # Layer2 -> Comp3: Selected Monitor Summary Info ("PropInfo")
                  # -----------------------------------------------------------
                  - Comp3:
                      - Class: "LABEL"
                      - Label: "PropInfo"
                      - CastType: "TEXT"
                      - IsDraggable: 0
                      - IsVisible: 1
                      - Type:
                          - Color: 0xFFE2E8F0
                          - TextStr: "Display #1 (Top-Left 0,0) [PRI]\nRel POS: (0, 0)\nModes: 4 | Status: ON"
                          - Font: "CodeNewRoman Nerd Font"
                          - FontSize: 12
                          - Format:
                              - Bold: 0
                              - Italic: 0
                              - Algin:
                                  - Vertical: "Top"
                                  - Horizona: "Left"
                          - IsWrap: 1
                          - Dim:
                              - W: 186
                              - H: 76
                              - OffsetX: 12
                              - OffsetY: 46
                              - Rotation: 0
                  # -----------------------------------------------------------
                  # Layer2 -> Comp4: Current Resolution Label ("PropResLabel", e.g. "Res: 1920x1080")
                  # -----------------------------------------------------------
                  - Comp4:
                      - Class: "LABEL"
                      - Label: "PropResLabel"
                      - CastType: "TEXT"
                      - IsDraggable: 0
                      - IsVisible: 1
                      - Type:
                          - Color: 0xFFFFFFFF
                          - TextStr: "Res: 1920x1080"
                          - Font: "CodeNewRoman Nerd Font"
                          - FontSize: 13
                          - Format:
                              - Bold: 1
                              - Italic: 0
                              - Algin:
                                  - Vertical: "Center"
                                  - Horizona: "Left"
                          - IsWrap: 0
                          - Dim:
                              - W: 186
                              - H: 18
                              - OffsetX: 12
                              - OffsetY: 132
                              - Rotation: 0
                  # -----------------------------------------------------------
                  # Layer2 -> Comp5: Current Refresh Rate Label ("PropFreqLabel", e.g. "Freq: 60 Hz")
                  # -----------------------------------------------------------
